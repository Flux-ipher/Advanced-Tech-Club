<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradOffline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="blueOffline" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="offlineShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="200" cy="200" r="160" fill="url(#bgGradOffline)" />
  <circle cx="310" cy="110" r="22" fill="#dbeafe" opacity="0.6" />
  <circle cx="90" cy="230" r="18" fill="#bfdbfe" opacity="0.4" />

  <!-- Ground Plane Shadow -->
  <ellipse cx="200" cy="336" rx="140" ry="12" fill="#cbd5e1" opacity="0.45" />

  <!-- Big Disconnected Wi-Fi Icon Badge -->
  <g transform="translate(140, 80)" filter="url(#offlineShadow)">
    <circle cx="60" cy="60" r="48" fill="#ffffff" />
    <!-- Wifi Arcs (Faded / Disconnected) -->
    <path d="M30 46 C48 30 72 30 90 46" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" fill="none" />
    <path d="M42 58 C52 48 68 48 78 58" stroke="#cbd5e1" stroke-width="6" stroke-linecap="round" fill="none" />
    <circle cx="60" cy="74" r="6" fill="#cbd5e1" />
    <!-- Red Slash across Wifi -->
    <line x1="26" y1="26" x2="94" y2="94" stroke="#ef4444" stroke-width="6" stroke-linecap="round" />
  </g>

  <!-- Disconnected Cable Graphics in Center -->
  <g transform="translate(90, 190)">
    <!-- Left Plug -->
    <path d="M40 50 L80 50" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
    <rect x="80" y="38" width="24" height="24" rx="6" fill="#1e293b" />
    <!-- Prongs -->
    <rect x="104" y="42" width="10" height="4" fill="#94a3b8" />
    <rect x="104" y="54" width="10" height="4" fill="#94a3b8" />

    <!-- Disconnected Gap with Spark -->
    <g transform="translate(118, 44)">
      <path d="M4 0 L8 6 L14 4 L10 10 L16 14 L8 12 L4 18 L4 10 Z" fill="#f59e0b" />
    </g>

    <!-- Right Socket -->
    <rect x="136" y="38" width="24" height="24" rx="6" fill="#1e293b" />
    <path d="M160 50 L200 50" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" />
  </g>

  <!-- Student Character observing unplugged cord -->
  <g transform="translate(250, 160)">
    <!-- Legs -->
    <rect x="22" y="106" width="10" height="66" rx="5" fill="#1e293b" />
    <rect x="38" y="106" width="10" height="66" rx="5" fill="#334155" />
    <ellipse cx="24" cy="172" rx="9" ry="5" fill="#0f172a" />
    <ellipse cx="46" cy="172" rx="9" ry="5" fill="#0f172a" />

    <!-- Torso -->
    <path d="M14 54 C14 44 54 44 54 54 L58 112 C58 114 10 114 10 112 Z" fill="url(#blueOffline)" />

    <!-- Head & Hair -->
    <ellipse cx="34" cy="30" rx="14" ry="16" fill="#fde68a" />
    <path d="M20 26 C20 12 48 12 48 24 C44 22 36 22 28 24 Z" fill="#0f172a" />

    <!-- Arms resting on hips -->
    <path d="M12 66 L-2 78 L12 86" stroke="url(#blueOffline)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M56 66 L68 78 L56 86" stroke="url(#blueOffline)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
