<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="heroBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="50%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e0e7ff" />
    </linearGradient>
    <linearGradient id="heroBlue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <linearGradient id="heroEmerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="heroShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#1e293b" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Giant Ambient Backplate Circles -->
  <circle cx="240" cy="200" r="180" fill="url(#heroBgGrad)" />
  <circle cx="380" cy="100" r="32" fill="#bfdbfe" opacity="0.5" />
  <circle cx="80" cy="140" r="24" fill="#dbeafe" opacity="0.6" />
  <circle cx="410" cy="280" r="16" fill="#a7f3d0" opacity="0.5" />

  <!-- Ground Plane Shadow -->
  <ellipse cx="240" cy="350" rx="190" ry="16" fill="#cbd5e1" opacity="0.45" />

  <!-- Central Desk with Technology Platform / Terminal -->
  <g transform="translate(130, 210)" filter="url(#heroShadow)">
    <!-- Desk Surface -->
    <rect x="0" y="40" width="220" height="14" rx="7" fill="#1e293b" />
    <!-- Desk Legs -->
    <rect x="24" y="54" width="8" height="84" rx="4" fill="#64748b" />
    <rect x="188" y="54" width="8" height="84" rx="4" fill="#64748b" />

    <!-- Open Laptop on Desk -->
    <rect x="80" y="2" width="60" height="38" rx="4" fill="#0f172a" />
    <rect x="83" y="5" width="54" height="32" rx="3" fill="#38bdf8" />
    <!-- Terminal Code lines on laptop screen -->
    <rect x="87" y="10" width="24" height="3" rx="1.5" fill="#ffffff" />
    <rect x="87" y="16" width="36" height="3" rx="1.5" fill="#ffffff" opacity="0.8" />
    <rect x="87" y="22" width="18" height="3" rx="1.5" fill="#10b981" />
    <rect x="70" y="38" width="80" height="4" rx="2" fill="#64748b" />

    <!-- Coffee Mug on desk -->
    <rect x="160" y="22" width="14" height="18" rx="3" fill="#3b82f6" />
    <path d="M174 26 C178 26 178 34 174 34" stroke="#3b82f6" stroke-width="2.5" fill="none" />
  </g>

  <!-- Left Student (Full-Stack Engineer) -->
  <g transform="translate(80, 150)">
    <!-- Legs seated/standing -->
    <rect x="36" y="116" width="11" height="74" rx="5" fill="#1e293b" />
    <rect x="52" y="116" width="11" height="74" rx="5" fill="#334155" />
    <ellipse cx="38" cy="192" rx="9" ry="5" fill="#0f172a" />
    <ellipse cx="60" cy="192" rx="9" ry="5" fill="#0f172a" />

    <!-- Body / VooDoo Blue Jacket -->
    <path d="M24 54 C24 42 70 42 70 54 L74 120 C74 122 20 122 20 120 Z" fill="url(#heroBlue)" />

    <!-- Head & Hair -->
    <ellipse cx="48" cy="28" rx="15" ry="17" fill="#fde68a" />
    <path d="M33 24 C33 10 63 10 63 22 C59 20 53 20 48 22 C42 20 37 20 33 24 Z" fill="#0f172a" />

    <!-- Arm pointing to code on screen -->
    <path d="M68 64 L96 76 L112 70" stroke="url(#heroBlue)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="114" cy="70" r="5" fill="#fde68a" />
  </g>

  <!-- Right Student (AI & Cloud Builder) -->
  <g transform="translate(290, 140)">
    <!-- Legs -->
    <rect x="36" y="126" width="11" height="74" rx="5" fill="#1e293b" />
    <rect x="52" y="126" width="11" height="74" rx="5" fill="#334155" />
    <ellipse cx="38" cy="202" rx="9" ry="5" fill="#0f172a" />
    <ellipse cx="60" cy="202" rx="9" ry="5" fill="#0f172a" />

    <!-- Body / Emerald Polo -->
    <path d="M24 64 C24 52 70 52 70 64 L74 130 C74 132 20 132 20 130 Z" fill="url(#heroEmerald)" />

    <!-- Head & Short Curls -->
    <ellipse cx="48" cy="36" rx="15" ry="17" fill="#fed7aa" />
    <path d="M32 30 C32 14 64 14 64 26 Z" fill="#1e1b4b" />

    <!-- Arm resting on desk holding tablet -->
    <path d="M26 74 L8 94 L-4 90" stroke="url(#heroEmerald)" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="-16" y="78" width="18" height="24" rx="3" fill="#1e293b" />
    <circle cx="-4" cy="90" r="5" fill="#fed7aa" />
  </g>

  <!-- Floating Holographic Badge (QR / Tech Cloud) -->
  <g transform="translate(200, 60)" filter="url(#heroShadow)">
    <rect x="0" y="0" width="80" height="74" rx="14" fill="#ffffff" />
    <!-- Floating QR matrix hints -->
    <rect x="12" y="12" width="18" height="18" rx="3" fill="#3b82f6" />
    <rect x="15" y="15" width="12" height="12" rx="2" fill="#ffffff" />
    <rect x="18" y="18" width="6" height="6" fill="#3b82f6" />

    <rect x="50" y="12" width="18" height="18" rx="3" fill="#3b82f6" />
    <rect x="53" y="15" width="12" height="12" rx="2" fill="#ffffff" />
    <rect x="56" y="18" width="6" height="6" fill="#3b82f6" />

    <rect x="12" y="44" width="18" height="18" rx="3" fill="#3b82f6" />
    <rect x="15" y="47" width="12" height="12" rx="2" fill="#ffffff" />
    <rect x="18" y="50" width="6" height="6" fill="#3b82f6" />

    <!-- Live status pill -->
    <rect x="36" y="48" width="32" height="12" rx="6" fill="#10b981" />
  </g>

  <!-- Sparkles & Energy Elements -->
  <path d="M380 180 L383 173 L390 170 L383 167 L380 160 L377 167 L370 170 L377 173 Z" fill="#fbbf24" />
  <path d="M90 90 L93 83 L100 80 L93 77 L90 70 L87 77 L80 80 L87 83 Z" fill="#38bdf8" />
</svg>
