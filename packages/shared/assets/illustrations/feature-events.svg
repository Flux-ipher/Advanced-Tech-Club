<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradEvents" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="blueEvents" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="eventsShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="5" stdDeviation="6" flood-color="#1e293b" flood-opacity="0.12" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="120" cy="100" r="78" fill="url(#bgGradEvents)" />
  <circle cx="48" cy="52" r="12" fill="#dbeafe" opacity="0.6" />
  <ellipse cx="120" cy="178" rx="82" ry="7" fill="#cbd5e1" opacity="0.4" />

  <!-- Presentation Board / Screen -->
  <g transform="translate(68, 28)" filter="url(#eventsShadow)">
    <!-- Stand legs -->
    <line x1="20" y1="110" x2="12" y2="145" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="84" y1="110" x2="92" y2="145" stroke="#94a3b8" stroke-width="3" stroke-linecap="round" />
    <line x1="52" y1="110" x2="52" y2="148" stroke="#64748b" stroke-width="3" stroke-linecap="round" />

    <!-- Board canvas -->
    <rect x="0" y="0" width="104" height="110" rx="10" fill="#ffffff" stroke="#e2e8f0" stroke-width="2" />
    <!-- Header banner -->
    <path d="M0 10 Q0 0 10 0 L94 0 Q104 0 104 10 L104 24 L0 24 Z" fill="url(#blueEvents)" />
    <!-- Mini calendar rings -->
    <circle cx="20" cy="8" r="2.5" fill="#ffffff" />
    <circle cx="36" cy="8" r="2.5" fill="#ffffff" />
    <circle cx="52" cy="8" r="2.5" fill="#ffffff" />
    <circle cx="68" cy="8" r="2.5" fill="#ffffff" />
    <circle cx="84" cy="8" r="2.5" fill="#ffffff" />

    <!-- Event presentation content inside board -->
    <!-- Event title line -->
    <rect x="12" y="32" width="50" height="6" rx="3" fill="#0f172a" />
    <!-- Date badge -->
    <rect x="68" y="30" width="24" height="10" rx="5" fill="#dbeafe" />
    <rect x="73" y="33" width="14" height="4" rx="2" fill="#2563eb" />

    <!-- Workshop code / diagram blocks -->
    <rect x="12" y="44" width="80" height="26" rx="4" fill="#f1f5f9" />
    <circle cx="19" cy="50" r="2" fill="#ef4444" />
    <circle cx="25" cy="50" r="2" fill="#f59e0b" />
    <circle cx="31" cy="50" r="2" fill="#10b981" />
    <rect x="16" y="56" width="36" height="3" rx="1.5" fill="#3b82f6" />
    <rect x="16" y="62" width="54" height="3" rx="1.5" fill="#94a3b8" />

    <!-- Growth / Attendance Curve -->
    <path d="M14 96 C28 92, 40 84, 52 86 C64 88, 76 74, 90 70" stroke="#10b981" stroke-width="2.5" stroke-linecap="round" fill="none" />
    <circle cx="90" cy="70" r="3.5" fill="#10b981" />
  </g>

  <!-- Presenter Character (Left) -->
  <g transform="translate(28, 80)">
    <!-- Head & Hair -->
    <ellipse cx="22" cy="20" rx="9" ry="10" fill="#fcd34d" />
    <path d="M13 18 C13 12 18 8 26 8 C30 8 32 11 31 16 C28 15 25 15 22 17 Z" fill="#1e293b" />
    <!-- Torso / Jacket -->
    <path d="M12 36 C12 30 16 28 22 28 C28 28 32 30 32 36 L34 68 L10 68 Z" fill="#2563eb" />
    <!-- Arm pointing to presentation board -->
    <path d="M28 34 L42 22 L45 25 L32 40 Z" fill="#2563eb" />
    <circle cx="45" cy="23" r="3.5" fill="#fcd34d" />
    <!-- Legs -->
    <rect x="14" y="68" width="6" height="24" rx="2" fill="#1e293b" />
    <rect x="24" y="68" width="6" height="24" rx="2" fill="#1e293b" />
  </g>

  <!-- Attendee Character (Right) -->
  <g transform="translate(178, 96)">
    <!-- Head -->
    <circle cx="16" cy="16" r="8" fill="#fdba74" />
    <path d="M9 14 C10 8 16 7 23 8 C23 12 21 14 18 14 Z" fill="#475569" />
    <!-- Torso -->
    <path d="M8 30 C8 24 12 22 16 22 C20 22 24 24 24 30 L26 56 L6 56 Z" fill="#10b981" />
    <!-- Laptop / Notes in hands -->
    <rect x="2" y="34" width="16" height="11" rx="2" fill="#0f172a" />
    <line x1="4" y1="42" x2="16" y2="42" stroke="#38bdf8" stroke-width="1.5" />
    <!-- Stool / Legs -->
    <rect x="10" y="56" width="5" height="18" rx="2" fill="#334155" />
    <rect x="17" y="56" width="5" height="18" rx="2" fill="#334155" />
  </g>

  <!-- Decorative Sparkles -->
  <path d="M196 42 L198 37 L203 35 L198 33 L196 28 L194 33 L189 35 L194 37 Z" fill="#fbbf24" />
  <circle cx="42" cy="148" r="2.5" fill="#38bdf8" />
  <circle cx="172" cy="46" r="3" fill="#10b981" />
</svg>
