<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Ambient Backdrop Circles -->
  <circle cx="200" cy="200" r="160" fill="url(#bgGrad)" />
  <circle cx="290" cy="120" r="28" fill="#dbeafe" opacity="0.6" />
  <circle cx="110" cy="270" r="20" fill="#e2e8f0" opacity="0.8" />
  <circle cx="310" cy="260" r="14" fill="#bfdbfe" opacity="0.5" />

  <!-- Ground Plane Shadow -->
  <ellipse cx="200" cy="330" rx="140" ry="14" fill="#cbd5e1" opacity="0.4" />

  <!-- Notice Board Stand -->
  <rect x="130" y="240" width="12" height="90" rx="6" fill="#64748b" />
  <rect x="258" y="240" width="12" height="90" rx="6" fill="#64748b" />
  <path d="M120 326 L152 326" stroke="#475569" stroke-width="6" stroke-linecap="round" />
  <path d="M248 326 L280 326" stroke="#475569" stroke-width="6" stroke-linecap="round" />

  <!-- Notice Board Board Frame -->
  <rect x="90" y="90" width="220" height="160" rx="16" fill="#3b82f6" filter="url(#softShadow)" />
  <rect x="98" y="98" width="204" height="144" rx="12" fill="#ffffff" />
  <rect x="106" y="106" width="188" height="128" rx="8" fill="#f8fafc" />

  <!-- Cork Board Grid Pattern Hints -->
  <circle cx="120" cy="120" r="2" fill="#cbd5e1" />
  <circle cx="160" cy="120" r="2" fill="#cbd5e1" />
  <circle cx="200" cy="120" r="2" fill="#cbd5e1" />
  <circle cx="240" cy="120" r="2" fill="#cbd5e1" />
  <circle cx="280" cy="120" r="2" fill="#cbd5e1" />
  <circle cx="120" cy="150" r="2" fill="#cbd5e1" />
  <circle cx="280" cy="150" r="2" fill="#cbd5e1" />
  <circle cx="120" cy="180" r="2" fill="#cbd5e1" />
  <circle cx="280" cy="180" r="2" fill="#cbd5e1" />

  <!-- Empty Notice Placeholders / Dashed outlines -->
  <rect x="120" y="126" width="70" height="78" rx="6" fill="#ffffff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4 4" />
  <rect x="210" y="126" width="70" height="78" rx="6" fill="#ffffff" stroke="#cbd5e1" stroke-width="2" stroke-dasharray="4 4" />

  <!-- Pushpins -->
  <circle cx="155" cy="126" r="5" fill="#ef4444" />
  <circle cx="245" cy="126" r="5" fill="#3b82f6" />

  <!-- Megaphone Icon Floating with Sparkles -->
  <g transform="translate(172, 142)">
    <circle cx="28" cy="26" r="26" fill="#eff6ff" />
    <path d="M18 24 L24 20 L36 16 L36 36 L24 32 L18 28 Z" fill="url(#primaryGrad)" />
    <rect x="14" y="24" width="5" height="4" rx="2" fill="#1e40af" />
    <path d="M22 31 L20 39 L25 39 L26 31 Z" fill="#64748b" />
    <path d="M38 21 C41 23 41 29 38 31" stroke="#3b82f6" stroke-width="2.5" stroke-linecap="round" />
    <path d="M42 18 C47 21 47 31 42 34" stroke="#60a5fa" stroke-width="2.5" stroke-linecap="round" />
  </g>

  <!-- Friendly Student Character Observing (Amico style) -->
  <g transform="translate(60, 160)">
    <!-- Legs -->
    <rect x="42" y="110" width="10" height="56" rx="5" fill="#1e293b" />
    <rect x="56" y="110" width="10" height="56" rx="5" fill="#334155" />
    <!-- Shoes -->
    <ellipse cx="44" cy="166" rx="9" ry="5" fill="#0f172a" />
    <ellipse cx="64" cy="166" rx="9" ry="5" fill="#0f172a" />
    <!-- Body / Hoodie -->
    <path d="M34 56 C34 46 72 46 72 56 L76 114 C76 116 32 116 32 114 Z" fill="url(#primaryGrad)" />
    <path d="M46 62 L46 78 M60 62 L60 78" stroke="#ffffff" stroke-width="2" stroke-linecap="round" opacity="0.6" />
    <!-- Head & Hair -->
    <ellipse cx="53" cy="34" rx="14" ry="16" fill="#fde68a" />
    <path d="M39 30 C39 16 67 16 67 28 C64 24 58 24 53 26 C47 24 42 26 39 30 Z" fill="#0f172a" />
    <!-- Hand on chin / curious posture -->
    <path d="M68 76 L78 64 L74 52" stroke="#fde68a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="74" cy="50" r="4" fill="#fde68a" />
  </g>

  <!-- Playful Float Elements -->
  <g transform="translate(290, 80)">
    <path d="M0 6 L6 0 L12 6 L6 12 Z" fill="#60a5fa" />
  </g>
  <g transform="translate(85, 80)">
    <circle cx="6" cy="6" r="4" fill="#fbbf24" />
  </g>
  <path d="M310 190 Q315 180 325 185" stroke="#38bdf8" stroke-width="3" stroke-linecap="round" fill="none" />
</svg>
