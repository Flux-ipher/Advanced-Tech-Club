<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradEvents" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="primaryGradEvents" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadowEvents" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.08" />
    </filter>
  </defs>

  <!-- Background Orbit -->
  <circle cx="200" cy="200" r="160" fill="url(#bgGradEvents)" />
  <circle cx="90" cy="130" r="18" fill="#dbeafe" opacity="0.6" />
  <circle cx="310" cy="110" r="24" fill="#bfdbfe" opacity="0.4" />

  <!-- Floor Shadow -->
  <ellipse cx="200" cy="336" rx="140" ry="12" fill="#cbd5e1" opacity="0.45" />

  <!-- Giant Desk Calendar -->
  <g transform="translate(100, 90)" filter="url(#shadowEvents)">
    <!-- Calendar Body -->
    <rect x="0" y="24" width="200" height="180" rx="18" fill="#ffffff" />
    <!-- Calendar Header -->
    <path d="M0 42 C0 30 10 24 22 24 L178 24 C190 24 200 30 200 42 L200 70 L0 70 Z" fill="url(#primaryGradEvents)" />

    <!-- Calendar Ring Binders -->
    <rect x="36" y="10" width="12" height="28" rx="6" fill="#64748b" />
    <rect x="94" y="10" width="12" height="28" rx="6" fill="#64748b" />
    <rect x="152" y="10" width="12" height="28" rx="6" fill="#64748b" />

    <!-- Calendar Month Text Placeholder -->
    <rect x="68" y="42" width="64" height="10" rx="5" fill="#ffffff" opacity="0.8" />

    <!-- Calendar Grid of Days -->
    <g transform="translate(20, 84)">
      <!-- Row 1 -->
      <circle cx="16" cy="16" r="10" fill="#f1f5f9" />
      <circle cx="48" cy="16" r="10" fill="#f1f5f9" />
      <circle cx="80" cy="16" r="10" fill="#f1f5f9" />
      <circle cx="112" cy="16" r="10" fill="#f1f5f9" />
      <circle cx="144" cy="16" r="10" fill="#f1f5f9" />

      <!-- Row 2 -->
      <circle cx="16" cy="46" r="10" fill="#f1f5f9" />
      <circle cx="48" cy="46" r="10" fill="#f1f5f9" />
      <circle cx="80" cy="46" r="10" fill="#f1f5f9" />
      <circle cx="112" cy="46" r="10" fill="#f1f5f9" />
      <circle cx="144" cy="46" r="10" fill="#f1f5f9" />

      <!-- Row 3 -->
      <circle cx="16" cy="76" r="10" fill="#f1f5f9" />
      <circle cx="48" cy="76" r="10" fill="#f1f5f9" />
      <!-- Star on one day -->
      <circle cx="80" cy="76" r="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
      <path d="M80 70 L82 74 L86 74 L83 77 L84 81 L80 79 L76 81 L77 77 L74 74 L78 74 Z" fill="#3b82f6" />
      <circle cx="112" cy="76" r="10" fill="#f1f5f9" />
      <circle cx="144" cy="76" r="10" fill="#f1f5f9" />
    </g>

    <!-- Hourglass / Clock floating badge -->
    <circle cx="180" cy="180" r="24" fill="#3b82f6" />
    <circle cx="180" cy="180" r="20" fill="#ffffff" />
    <path d="M180 168 L180 180 L188 184" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Friendly Student Character looking at calendar -->
  <g transform="translate(250, 150)">
    <!-- Legs -->
    <rect x="22" y="118" width="11" height="64" rx="5" fill="#1e293b" />
    <rect x="38" y="118" width="11" height="64" rx="5" fill="#334155" />
    <ellipse cx="24" cy="184" rx="9" ry="5" fill="#0f172a" />
    <ellipse cx="46" cy="184" rx="9" ry="5" fill="#0f172a" />

    <!-- Jacket & Body -->
    <path d="M14 60 C14 48 54 48 54 60 L58 122 C58 124 10 124 10 122 Z" fill="#0284c7" />

    <!-- Arm reaching pointing to calendar -->
    <path d="M16 68 L-14 82 L-8 96" stroke="#0284c7" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <circle cx="-8" cy="98" r="5" fill="#fde68a" />

    <!-- Head & Cap -->
    <ellipse cx="34" cy="36" rx="14" ry="16" fill="#fde68a" />
    <path d="M18 32 C18 18 48 18 50 30 C45 28 35 28 20 32 Z" fill="#3b82f6" />
    <path d="M16 32 L8 34" stroke="#3b82f6" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Decorative Sparkles -->
  <path d="M70 200 L74 192 L78 200 L86 204 L78 208 L74 216 L70 208 L62 204 Z" fill="#fbbf24" />
  <circle cx="330" cy="220" r="4" fill="#60a5fa" />
</svg>
