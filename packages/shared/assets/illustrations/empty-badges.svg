<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradBadges" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#fefce8" />
    </linearGradient>
    <linearGradient id="trophyGold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fcd34d" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <linearGradient id="pedestalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="badgeShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="200" cy="200" r="160" fill="url(#bgGradBadges)" />
  <circle cx="90" cy="110" r="20" fill="#dbeafe" opacity="0.6" />
  <circle cx="310" cy="120" r="26" fill="#fef08a" opacity="0.5" />

  <!-- Ground Plane Shadow -->
  <ellipse cx="200" cy="330" rx="130" ry="12" fill="#cbd5e1" opacity="0.4" />

  <!-- Pedestal -->
  <g transform="translate(130, 230)" filter="url(#badgeShadow)">
    <path d="M20 50 L120 50 L130 90 L10 90 Z" fill="url(#pedestalGrad)" />
    <rect x="0" y="86" width="140" height="14" rx="7" fill="#1e40af" />
    <!-- Star on pedestal -->
    <path d="M70 60 L73 68 L81 68 L75 73 L77 81 L70 76 L63 81 L65 73 L59 68 L67 68 Z" fill="#ffffff" opacity="0.8" />
  </g>

  <!-- Golden Trophy Graphics -->
  <g transform="translate(136, 96)" filter="url(#badgeShadow)">
    <!-- Left Handle -->
    <path d="M24 30 C4 30 4 64 26 70" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none" />
    <!-- Right Handle -->
    <path d="M104 30 C124 30 124 64 102 70" stroke="#f59e0b" stroke-width="8" stroke-linecap="round" fill="none" />

    <!-- Trophy Cup Body -->
    <path d="M20 16 L108 16 L100 80 C96 100 76 112 64 112 C52 112 32 100 28 80 Z" fill="url(#trophyGold)" />
    <!-- Trophy Lip -->
    <rect x="16" y="10" width="96" height="12" rx="6" fill="#fbbf24" />

    <!-- Trophy Stem & Base -->
    <rect x="58" y="112" width="12" height="26" fill="#d97706" />
    <path d="M44 136 L84 136 L90 148 L38 148 Z" fill="url(#trophyGold)" />

    <!-- Unlocked / Blank Sparkle in Trophy -->
    <circle cx="64" cy="56" r="20" fill="#ffffff" opacity="0.9" />
    <text x="64" y="64" font-family="system-ui, sans-serif" font-size="24" font-weight="bold" fill="#3b82f6" text-anchor="middle">?</text>
  </g>

  <!-- Floating Star Badges waiting to be unlocked -->
  <g transform="translate(80, 150)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M16 8 L18 13 L23 13 L19 16 L21 21 L16 18 L11 21 L13 16 L9 13 L14 13 Z" fill="#cbd5e1" />
  </g>
  <g transform="translate(290, 170)">
    <circle cx="16" cy="16" r="16" fill="#ffffff" stroke="#93c5fd" stroke-width="2" stroke-dasharray="4 4" />
    <path d="M16 8 L18 13 L23 13 L19 16 L21 21 L16 18 L11 21 L13 16 L9 13 L14 13 Z" fill="#cbd5e1" />
  </g>

  <!-- Sparkles -->
  <path d="M110 90 L113 83 L120 80 L113 77 L110 70 L107 77 L100 80 L107 83 Z" fill="#fbbf24" />
  <path d="M280 80 L283 73 L290 70 L283 67 L280 60 L277 67 L270 70 L277 73 Z" fill="#60a5fa" />
</svg>
