<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGrad404" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f1f5f9" />
    </linearGradient>
    <linearGradient id="blue404" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="shadow404" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="200" cy="200" r="160" fill="url(#bgGrad404)" />
  <circle cx="80" cy="120" r="22" fill="#dbeafe" opacity="0.6" />
  <circle cx="320" cy="130" r="18" fill="#bfdbfe" opacity="0.4" />

  <!-- Ground Plane Shadow -->
  <ellipse cx="200" cy="336" rx="140" ry="12" fill="#cbd5e1" opacity="0.4" />

  <!-- Giant Bold 404 Typography Floating -->
  <g transform="translate(60, 90)" filter="url(#shadow404)">
    <!-- First '4' -->
    <path d="M40 90 L40 30 L10 74 L10 90 L56 90 M40 70 L40 110" stroke="#3b82f6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
    <!-- '0' as broken compass / map target -->
    <circle cx="140" cy="70" r="40" stroke="#93c5fd" stroke-width="14" fill="#ffffff" />
    <circle cx="140" cy="70" r="12" fill="#ef4444" />
    <path d="M120 70 L160 70 M140 50 L140 90" stroke="#ef4444" stroke-width="3" stroke-linecap="round" stroke-dasharray="2 3" />
    <!-- Second '4' -->
    <path d="M250 90 L250 30 L220 74 L220 90 L266 90 M250 70 L250 110" stroke="#3b82f6" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" fill="none" />
  </g>

  <!-- Friendly Student Character looking puzzled with map -->
  <g transform="translate(150, 170)">
    <!-- Legs -->
    <rect x="36" y="96" width="10" height="60" rx="5" fill="#1e293b" />
    <rect x="54" y="96" width="10" height="60" rx="5" fill="#334155" />
    <ellipse cx="38" cy="156" rx="9" ry="5" fill="#0f172a" />
    <ellipse cx="62" cy="156" rx="9" ry="5" fill="#0f172a" />

    <!-- Body -->
    <path d="M26 48 C26 38 74 38 74 48 L78 100 C78 102 22 102 22 100 Z" fill="url(#blue404)" />

    <!-- Head & Hair -->
    <ellipse cx="50" cy="24" rx="14" ry="16" fill="#fde68a" />
    <path d="M36 20 C36 8 64 8 64 18 C60 16 54 16 50 18 C44 16 40 18 36 20 Z" fill="#0f172a" />

    <!-- Hands holding folded map -->
    <g transform="translate(20, 52)">
      <polygon points="10,8 30,2 48,8 48,36 30,30 10,36" fill="#ffffff" stroke="#94a3b8" stroke-width="2" />
      <path d="M30 2 L30 30" stroke="#cbd5e1" stroke-width="2" />
      <!-- Red pin on map -->
      <circle cx="28" cy="16" r="3" fill="#ef4444" />
      <!-- Student hands -->
      <circle cx="10" cy="24" r="5" fill="#fde68a" />
      <circle cx="48" cy="24" r="5" fill="#fde68a" />
    </g>
  </g>

  <!-- Broken Direction Signboard on the left -->
  <g transform="translate(70, 200)">
    <rect x="18" y="20" width="8" height="110" rx="4" fill="#64748b" />
    <!-- Top sign pointing left -->
    <path d="M0 30 L40 30 L48 40 L40 50 L0 50 Z" fill="#3b82f6" />
    <rect x="6" y="38" width="24" height="4" rx="2" fill="#ffffff" />
    <!-- Broken bottom sign angled -->
    <g transform="rotate(18, 22, 65)">
      <path d="M4 60 L44 60 L52 70 L44 80 L4 80 Z" fill="#93c5fd" />
      <rect x="10" y="68" width="20" height="4" rx="2" fill="#ffffff" />
    </g>
  </g>

  <!-- Sparkles -->
  <circle cx="330" cy="240" r="4" fill="#60a5fa" />
  <circle cx="90" cy="80" r="4" fill="#fbbf24" />
</svg>
