<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 200" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradQr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="blueQr" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="qrShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#1e293b" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="120" cy="100" r="80" fill="url(#bgGradQr)" />
  <circle cx="190" cy="50" r="14" fill="#dbeafe" opacity="0.6" />
  <ellipse cx="120" cy="176" rx="70" ry="8" fill="#cbd5e1" opacity="0.4" />

  <!-- Smartphone Scanning QR Code -->
  <g transform="translate(70, 30)" filter="url(#qrShadow)">
    <!-- Phone Body -->
    <rect x="0" y="0" width="100" height="140" rx="16" fill="#1e293b" />
    <rect x="5" y="6" width="90" height="128" rx="12" fill="#ffffff" />

    <!-- Speaker Notch -->
    <rect x="40" y="10" width="20" height="4" rx="2" fill="#94a3b8" />

    <!-- Screen QR Code Content -->
    <g transform="translate(20, 24)">
      <!-- Top Left Eye -->
      <rect x="0" y="0" width="18" height="18" rx="3" fill="#3b82f6" />
      <rect x="3" y="3" width="12" height="12" rx="2" fill="#ffffff" />
      <rect x="6" y="6" width="6" height="6" fill="#3b82f6" />

      <!-- Top Right Eye -->
      <rect x="42" y="0" width="18" height="18" rx="3" fill="#3b82f6" />
      <rect x="45" y="3" width="12" height="12" rx="2" fill="#ffffff" />
      <rect x="48" y="6" width="6" height="6" fill="#3b82f6" />

      <!-- Bottom Left Eye -->
      <rect x="0" y="42" width="18" height="18" rx="3" fill="#3b82f6" />
      <rect x="3" y="45" width="12" height="12" rx="2" fill="#ffffff" />
      <rect x="6" y="48" width="6" height="6" fill="#3b82f6" />

      <!-- Data Dots -->
      <rect x="24" y="6" width="10" height="6" fill="#1d4ed8" />
      <rect x="24" y="24" width="12" height="12" rx="2" fill="#10b981" />
      <rect x="42" y="24" width="6" height="10" fill="#1d4ed8" />
      <rect x="24" y="44" width="14" height="6" fill="#1d4ed8" />
      <rect x="44" y="44" width="16" height="16" rx="2" fill="#3b82f6" />
    </g>

    <!-- Glowing Scan Line -->
    <line x1="12" y1="62" x2="88" y2="62" stroke="#10b981" stroke-width="3" stroke-linecap="round" />

    <!-- Success Check Badge below QR -->
    <g transform="translate(36, 100)">
      <rect x="0" y="0" width="28" height="16" rx="8" fill="#10b981" />
      <path d="M8 8 L12 11 L19 5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />
    </g>
  </g>

  <!-- Sparkles -->
  <path d="M40 70 L42 65 L47 63 L42 61 L40 56 L38 61 L33 63 L38 65 Z" fill="#fbbf24" />
  <circle cx="190" cy="140" r="3" fill="#38bdf8" />
</svg>
