<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradProf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="blueProf" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="profShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="200" cy="200" r="160" fill="url(#bgGradProf)" />
  <circle cx="310" cy="110" r="22" fill="#dbeafe" opacity="0.6" />
  <circle cx="90" cy="230" r="18" fill="#bfdbfe" opacity="0.4" />

  <!-- Floor Shadow -->
  <ellipse cx="200" cy="336" rx="140" ry="12" fill="#cbd5e1" opacity="0.45" />

  <!-- Floating Student ID Card Preview -->
  <g transform="translate(100, 90)" filter="url(#profShadow)">
    <rect x="0" y="0" width="180" height="120" rx="14" fill="#ffffff" />
    <!-- Blue Card Header Bar -->
    <path d="M0 14 C0 6 6 0 14 0 L166 0 C174 0 180 6 180 14 L180 30 L0 30 Z" fill="url(#blueProf)" />
    <rect x="14" y="10" width="40" height="8" rx="4" fill="#ffffff" opacity="0.8" />

    <!-- Avatar Placeholder with Camera Icon -->
    <circle cx="38" cy="68" r="20" fill="#eff6ff" stroke="#3b82f6" stroke-width="2" />
    <circle cx="38" cy="64" r="7" fill="#3b82f6" />
    <path d="M26 78 C26 72 32 68 38 68 C44 68 50 72 50 78" fill="#3b82f6" />

    <!-- Text Field Lines -->
    <rect x="70" y="50" width="80" height="8" rx="4" fill="#1e293b" />
    <rect x="70" y="66" width="60" height="6" rx="3" fill="#64748b" />
    <rect x="70" y="78" width="70" height="6" rx="3" fill="#cbd5e1" />

    <!-- Holographic Chip -->
    <rect x="136" y="88" width="28" height="18" rx="4" fill="#fbbf24" opacity="0.8" />
  </g>

  <!-- Big Pen Drawing a Checkmark -->
  <g transform="translate(240, 160) rotate(-25)">
    <rect x="0" y="0" width="12" height="90" rx="4" fill="#3b82f6" />
    <!-- Pen Tip -->
    <path d="M0 90 L6 106 L12 90 Z" fill="#fde68a" />
    <path d="M5 102 L6 106 L7 102 Z" fill="#0f172a" />
    <!-- Pen Cap / Clip -->
    <rect x="-3" y="10" width="3" height="30" rx="1.5" fill="#1d4ed8" />
    <rect x="0" y="10" width="12" height="16" fill="#1d4ed8" />
  </g>

  <!-- Verification Badge -->
  <g transform="translate(180, 220)" filter="url(#profShadow)">
    <circle cx="20" cy="20" r="20" fill="#10b981" />
    <path d="M12 20 L18 26 L29 14" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- Sparkles -->
  <path d="M80 180 L83 173 L90 170 L83 167 L80 160 L77 167 L70 170 L77 173 Z" fill="#fbbf24" />
  <circle cx="310" cy="230" r="4" fill="#60a5fa" />
</svg>
