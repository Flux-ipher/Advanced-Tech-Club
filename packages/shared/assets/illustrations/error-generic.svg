<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%" fill="none">
  <defs>
    <linearGradient id="bgGradGen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#eff6ff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#1d4ed8" />
    </linearGradient>
    <filter id="genShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#1e293b" flood-opacity="0.1" />
    </filter>
  </defs>

  <!-- Ambient Backdrop -->
  <circle cx="200" cy="200" r="160" fill="url(#bgGradGen)" />
  <circle cx="310" cy="110" r="24" fill="#dbeafe" opacity="0.6" />
  <circle cx="80" cy="220" r="18" fill="#bfdbfe" opacity="0.4" />

  <!-- Floor Shadow -->
  <ellipse cx="200" cy="336" rx="140" ry="12" fill="#cbd5e1" opacity="0.45" />

  <!-- Computer Monitor / Terminal Window -->
  <g transform="translate(110, 100)" filter="url(#genShadow)">
    <!-- Stand -->
    <rect x="80" y="160" width="20" height="40" fill="#64748b" />
    <ellipse cx="90" cy="200" rx="44" ry="8" fill="#475569" />

    <!-- Screen Bezel -->
    <rect x="0" y="0" width="180" height="160" rx="14" fill="#1e293b" />
    <!-- Screen Glass -->
    <rect x="8" y="8" width="164" height="144" rx="8" fill="#0f172a" />

    <!-- Window Top Header Bar -->
    <rect x="8" y="8" width="164" height="20" rx="8" fill="#1e293b" />
    <circle cx="20" cy="18" r="4" fill="#ef4444" />
    <circle cx="32" cy="18" r="4" fill="#f59e0b" />
    <circle cx="44" cy="18" r="4" fill="#10b981" />

    <!-- Big X on screen -->
    <circle cx="90" cy="84" r="30" fill="#ef4444" opacity="0.15" />
    <circle cx="90" cy="84" r="24" fill="#ef4444" />
    <path d="M82 76 L98 92 M98 76 L82 92" stroke="#ffffff" stroke-width="4" stroke-linecap="round" />

    <!-- Code error lines below -->
    <rect x="40" y="124" width="100" height="6" rx="3" fill="#334155" />
    <rect x="60" y="136" width="60" height="4" rx="2" fill="#ef4444" opacity="0.6" />
  </g>

  <!-- Wrench / Screwdriver Tools floating on side -->
  <g transform="translate(70, 180) rotate(-35)">
    <rect x="0" y="10" width="10" height="50" rx="4" fill="#3b82f6" />
    <circle cx="5" cy="10" r="12" fill="#3b82f6" />
    <circle cx="5" cy="10" r="6" fill="#f1f5f9" />
  </g>

  <!-- Sparkles -->
  <path d="M310 180 L313 173 L320 170 L313 167 L310 160 L307 167 L300 170 L307 173 Z" fill="#fbbf24" />
  <circle cx="290" cy="240" r="5" fill="#60a5fa" />
</svg>
